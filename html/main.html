<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/design.css">
     <script src="../js/main.js"></script>
    <title>BIT by BIT | Pixel Camera</title>
</head>
<body>
    <main class="main_body">
        <header class="main_header">
            <div>
                  <p class="header_1"> ESP32S3 N16R8 Camera</p>
                  <h1>BIT <span>by</span> BIT</h1>
            </div>
            
        </header>
        
        <section class="caption_section">
            <p> A tiny little <br><span>bit</span> of everyday.</p>
        </section>

        <section class="main_camera_card">
            
            <!--To update when actually use a lipo battery
            <div class="battery_status">
                <p>Battery: 80%</p> 
            </div> -->
            
            <div class="camera_card">
                <img src="../images/camera.png" alt="insert camera picture" class="camera_img">
                <p class="camera_name_text">ESP32S3 Pixel Camera/Name</p>
            </div>
            <a class="filter_btn" href="../html/filters.html">Filters<b>></b></a>
            <a class="gallery_btn" href="../html/gallery.html">Gallery<b>></b></a>
        </section>

        <section class="status">
            <p class="total_photos"><strong id="total_photos_taken">0</strong><span>Total<br>Photos</span></p>
            <p class="storage"><strong id="storage_used_percent">0%</strong><span>Storage<br>Used</span></p>
        </section>
    </main>
</body>
</html>
