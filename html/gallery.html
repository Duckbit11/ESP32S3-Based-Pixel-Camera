<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/design.css">
    <script src="../js/gallery.js" defer></script>
    <title>BIT by BIT | Gallery</title>
</head>
<body>
    <main class="main_body">
        <header class="main_header">
            <div class="title_block">
                <p class="header_1">ESP32S3 N16R8 Camera</p>
                <h1>BIT <span>by</span> BIT</h1>
            </div>

            <div class="gallery_storage">
                <strong>0 / 0 GB</strong>
                <span>Used</span>
            </div>
        </header>

          <section class="gallery_grid" aria-label="Photo gallery">
            <!-- Dynamic gallery items loaded via JS -->
          </section>

    </main>

    <div id="photo_modal" class="modal">
        <div class="modal_content">
            <button class="close_modal">&times;</button>
            <div class="modal_img_wrapper">
                <img id="modal_img" src="" alt="Full view preview" />
            </div>
            <div class="modal_footer">
                <span id="modal_filename"></span>
                <a id="download_btn" class="download_link" href="" download>Download</a>
                <button id="delete_btn" class="delete_btn">Delete</button>
            </div>
        </div>
    </div>
</body>
</html>
