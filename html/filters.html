<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/design.css">
    <title>BIT by BIT | Filters</title>
</head>
<body>
    <main class="main_body palette_page">
        <header class="main_header">
            <div class="title_block">
                <p class="header_1">ESP32S3 N16R8 Camera</p>
                <h1>BIT <span>by</span> BIT</h1>
            </div>
            
        </header>

        <!-- new part to learn-->
        <section class="palette_intro">
            <p class="page_header">Filter Palette Studio</p>
            <h2>Set an 8-color Palette</h2>
        </section>

        <section class="custom_palette_panel">
            <div class="custom_palette_header">
                <label for="palette_name">Palette name</label>
                <input id="palette_name" type="text" value="My Custom Palette" maxlength="30">
            </div>
            <label for="custom_hex_input">Hex codes</label>
            <textarea id="custom_hex_input" rows="4" placeholder="Hexcode separated by: . , / space/enter&#10;&#10;Ex.&#10;#ff0000, #00ff00. #0000ff / #ffcc00&#10;#12ab34&#10;#888888..."></textarea>
            <div class="custom_palette_actions">
                <button id="apply_custom_palette" type="button">Apply custom palette</button>
            </div>
        </section>

        <section id="palette_container" class="palette_container"></section>
    </main>
    <script src="../js/filters.js"></script>
